<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Library Events</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<header id="site-header">
  <p class="site-name">City Library Events</p>
  <nav aria-label="Main">
    <ul>
      <li><a href="events.html">Events</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main id="content">
  <h1>Welcome to the City Library</h1>

  <section>
    <h2>Upcoming Events</h2>
    <p>Join us for <b>storytime <i>every Saturday.</i></b></p>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfg4RTIc2PtgvWFnEIjRt_ZbFjXm2t-adL1fxPxSUZlQ&s=10" alt="Illustration of a storyteller holding a book and reading to a group of children">
    <p>Free entry for everyone.</p>
  </section>

  <section id="contact">
    <h2>Contact Us</h2>
    <form action="/subscribe" method="post">
      <p><label for="name">Name:</label> <input type="text" id="name" name="name"></p>
      <p><label for="email">Email:</label> <input type="email" id="email" name="email"></p>
      <p><label for="message">Message:</label> <textarea id="message" name="message"></textarea></p>
      <button type="submit">Send</button>
    </form>
  </section>
</main>

</body>
</html>
